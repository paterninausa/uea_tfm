#
# Spark Structured Streaming NO se containeriza: se ejecuta desde el venv del
# host contra el listener EXTERNAL de Kafka (localhost:29092). Por eso Kafka
# publica dos listeners — ver la nota en el servicio `kafka`.
#
# Uso:
#   docker compose -f pipeline/docker-compose.yml up -d         # stack base
#   python pipeline/schemas/register_schema.py                  # obligatorio antes de arrancar el bridge
#   docker compose -f pipeline/docker-compose.yml --profile bridge up -d bridge
#
#   docker compose -f pipeline/docker-compose.yml ps
#   docker compose -f pipeline/docker-compose.yml down          # conserva datos
#   docker compose -f pipeline/docker-compose.yml down -v       # borra volumenes

name: tfm-iot

services:

  # ---------------------------------------------------------------------------
  # Broker MQTT — punto de entrada de la telemetria de los medidores simulados
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: tfm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT — lo usa el simulador desde el host
      - "9001:9001"   # WebSockets — solo inspeccion manual
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # mosquitto_sub esta incluido en la imagen. -E sale tras suscribirse, asi
      # que el chequeo confirma que el broker acepta conexiones de verdad.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/#", "-C", "1", "-E", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # Kafka en modo KRaft (sin Zookeeper) — log reproducible de la arquitectura
  # Kappa. Nodo unico combinando los roles de broker y controller.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: tfm-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"   # listener EXTERNAL — Spark y utilidades desde el host
    environment:
      # --- Identidad y roles del nodo KRaft ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners duales (clave para el desarrollo con Spark en el host) ---
      # INTERNAL (kafka:9092): lo usan los contenedores de la red tfm-net.
      # EXTERNAL (localhost:29092): lo usa todo lo que corre en el host.
      # Un unico listener no sirve: el nombre `kafka` no resuelve desde el host
      # y `localhost` no resuelve al broker desde otro contenedor.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Parametros de cluster de un solo nodo ---
      # Con un unico broker el factor de replicacion solo puede ser 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Retencion 7 dias ---
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # Creacion declarativa de topicos (servicio de un solo uso)
  # ---------------------------------------------------------------------------
  # Se crean aqui y no por auto-creacion (deshabilitada arriba a proposito):
  # la auto-creacion aplicaria los valores por defecto y silenciaria erratas en
  # los nombres de topico, que apareceria como "no llegan datos" mas adelante.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: tfm-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # `command` en formato lista y cada invocacion en una sola linea: si se
    # escribe como string multilinea, Compose aplica word-splitting tipo shell
    # y se come las continuaciones de linea `\`, dejando comandos truncados.
    command:
      - |
        set -e
        echo '==> Creando topicos del pipeline'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.telemetry.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.telemetry.dlq --partitions 1 --replication-factor 1 --config retention.ms=-1
        echo '==> Fijando retencion infinita en la DLQ'
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --entity-type topics --entity-name iot.telemetry.dlq --alter --add-config retention.ms=-1
        echo '==> Topicos existentes:'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # Apicurio Schema Registry — gobernanza de esquemas Avro (Objetivo 2)
  # ---------------------------------------------------------------------------
  # Almacenamiento kafkasql: el registro persiste su estado en un topico de
  # Kafka en lugar de en memoria o en una base de datos aparte. Se elige porque
  # (a) los esquemas sobreviven a un reinicio del contenedor, que es requisito
  # para poder demostrar la evolucion de esquema del Objetivo 2, y (b) no anade
  # ninguna dependencia nueva al stack, ya que Kafka esta presente igualmente.
  apicurio:
    image: apicurio/apicurio-registry:3.3.1
    container_name: tfm-apicurio
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"   # API REST del registro
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:9092
      # Apicurio 3.x deshabilita por defecto el borrado via API REST (devuelve
      # HTTP 405). Se habilita porque el almacenamiento kafkasql es persistente:
      # sin esto, un esquema registrado por error durante el desarrollo no se
      # puede retirar ni reiniciando el contenedor. En un despliegue real se
      # dejaria deshabilitado.
      APICURIO_REST_DELETION_GROUP_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT_VERSION_ENABLED: "true"
      # Permite que la UI (otro origen: localhost:8888) llame a la API REST.
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    healthcheck:
      # Se usa en su lugar una
      # llamada real a la API: listar grupos obliga a atravesar la capa de
      # almacenamiento kafkasql, asi que un 200 aqui prueba que el registro
      # esta realmente operativo y no solo que el puerto responde.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/apis/registry/v3/groups"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # UI de Apicurio — en la version 3.x es un contenedor separado del backend
  # ---------------------------------------------------------------------------
  apicurio-ui:
    image: apicurio/apicurio-registry-ui:3.3.1
    container_name: tfm-apicurio-ui
    restart: unless-stopped
    depends_on:
      apicurio:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      # URL que usara el NAVEGADOR para hablar con la API, no el contenedor:
      # por eso es localhost y no apicurio.
      REGISTRY_API_URL: http://localhost:8080/apis/registry/v3
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # Bridge — MQTT -> Kafka con validacion Avro (Objetivos 1 y 2)
  # ---------------------------------------------------------------------------
  # Bajo un profile aparte ("bridge"): un `docker compose up -d` normal NO lo
  # arranca, porque necesita el esquema YA registrado en Apicurio para poder
  # resolverlo (register_schema.py sigue siendo un paso manual posterior).
  # Arrancarlo junto al resto lo dejaria en bucle de reinicio hasta que alguien
  # registre el esquema. Se levanta aparte, a proposito:
  #
  #   docker compose -f pipeline/docker-compose.yml up -d          # stack base
  #   python pipeline/schemas/register_schema.py
  #   docker compose -f pipeline/docker-compose.yml --profile bridge up -d bridge
  #
  # Sin container_name fijo, a diferencia del resto de servicios: es
  # deliberado, para no impedir levantar una segunda instancia mas adelante
  # (Docker exige nombres de contenedor unicos). Preparado para escalar
  # horizontalmente via --shared-group (suscripcion compartida de MQTT).
  bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    profiles: ["bridge"]
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
      apicurio:
        condition: service_healthy
    command:
      - "--broker-host=mosquitto"
      - "--bootstrap-servers=kafka:9092"
      - "--registry-url=http://apicurio:8080"
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # TimescaleDB — metricas agregadas por ventana temporal -> Grafana
  # ---------------------------------------------------------------------------
  # Se usa la variante `-oss` (edicion Apache-2) y no la imagen por defecto:
  # esta ultima incluye funciones bajo Timescale License, que es
  # source-available pero NO open source segun la OSI, y el trabajo sostiene
  # que el stack es integramente open-source. La edicion Apache-2 conserva las
  # hypertables, que es lo que necesita el pipeline; lo que renuncia son las
  # continuous aggregates y la compresion, irrelevantes aqui porque la
  # agregacion la hace Spark.
  timescaledb:
    image: timescale/timescaledb:2.29.1-pg17-oss
    container_name: tfm-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tfm_metrics
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm_dev_password
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      # Los scripts de este directorio se ejecutan una unica vez, cuando el
      # volumen de datos esta vacio. Si se cambia el DDL hay que recrear el
      # volumen (docker compose down -v) para que se vuelvan a aplicar.
      - ./docker/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm -d tfm_metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # PostgreSQL — eventos individuales enriquecidos -> Power BI
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: tfm-postgres
    restart: unless-stopped
    ports:
      # 5433 en el host: 5432 ya lo ocupa TimescaleDB, que tambien es un
      # PostgreSQL. Dentro de la red de contenedores ambos escuchan en 5432.
      - "5433:5432"
    environment:
      POSTGRES_DB: tfm_analytics
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm -d tfm_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [tfm-net]

  # ---------------------------------------------------------------------------
  # Grafana — dashboards operativos sobre TimescaleDB (Objetivo 4)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.0.6
    container_name: tfm-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Entorno de desarrollo local: sin registro de usuarios ni telemetria.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Acceso anonimo de solo lectura: para una demo o defensa, cada reinicio
      # del contenedor (docker compose down/up, p.ej. entre dos ejecuciones de
      # demo.py) invalida la sesion de quien tenga el navegador abierto y
      # obliga a reintroducir admin/admin. Sin sesion que perder, esto no
      # ocurre. El rol Viewer no permite editar ni administrar: solo ver.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      # Aprovisionamiento declarativo: la fuente de datos se define en un
      # fichero versionado, no pulsando en la interfaz. Asi el dashboard es
      # reproducible al clonar el repo.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [tfm-net]

networks:
  tfm-net:
    driver: bridge

volumes:
  mosquitto-data:
  kafka-data:
  timescaledb-data:
  postgres-data:
  grafana-data:
