# Configuracion de Mosquitto para el pipeline IoT del TFM.
#
# Mosquitto es la implementacion de referencia de broker MQTT de la Eclipse
# Foundation. Se descarto NanoMQ: su puente nativo a Kafka resulto ser una
# funcion exclusiva de EMQX Enterprise (de pago), no disponible en la version
# open-source. El puente MQTT->Kafka se implementa como microservicio propio.

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# Listener WebSockets: no lo usa el pipeline, pero permite inspeccionar el
# trafico con clientes de navegador durante el desarrollo.
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Autenticacion
# ---------------------------------------------------------------------------
# Entorno de desarrollo local y aislado: sin autenticacion. En un despliegue
# real esto se sustituiria por password_file o autenticacion TLS mutua.
allow_anonymous true

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
# Necesaria para que las sesiones persistentes y los mensajes QoS 1 en vuelo
# sobrevivan a un reinicio del broker: es parte de la evidencia del Objetivo 5
# (recuperacion ante fallo de un servicio individual sin perdida de datos).
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# ---------------------------------------------------------------------------
# Limites y colas
# ---------------------------------------------------------------------------
# El simulador debe poder llegar a >=500 sensores concurrentes (Objetivo 5).
# Los valores por defecto de max_inflight_messages (20) estrangularian el
# throughput con QoS 1, que es el QoS que usa el simulador.
max_inflight_messages 200
max_queued_messages 10000
message_size_limit 0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
